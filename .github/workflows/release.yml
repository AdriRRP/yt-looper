name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and package without creating a GitHub Release
        required: true
        default: true
        type: boolean
      release_tag:
        description: Existing vX.Y.Z tag to retry (required when dry_run is false)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dry_run: ${{ steps.release.outputs.dry_run }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve and verify release identity
        id: release
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            dry_run=false
          else
            tag="$INPUT_RELEASE_TAG"
            dry_run="$INPUT_DRY_RUN"
          fi

          if [[ "$dry_run" != "true" && -z "$tag" ]]; then
            echo "release_tag is required when dry_run is false" >&2
            exit 1
          fi

          if [[ -n "$tag" ]]; then
            npm run release:verify -- --tag "$tag"
          else
            npm run release:verify
          fi

          version="$(node --input-type=module -e "import data from './package.json' with { type: 'json' }; console.log(data.version)")"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run complete quality gate
        run: npm run check:full
      - name: Upload the verified browser builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-browser-builds-v${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browser-flows:
    name: Release browser flows (${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the exact verified browser builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-browser-builds-v${{ needs.verify.outputs.version }}
          path: dist
      - name: Install the real browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise product flows
        env:
          YT_LOOPER_E2E_PREBUILT: "1"
        run: npm run test:e2e -- --project=${{ matrix.browser }}

  package:
    name: Package verified extensions
    needs: [verify, browser-flows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the exact browser builds exercised by E2E
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-browser-builds-v${{ needs.verify.outputs.version }}
          path: dist
      - name: Package the already verified browser builds
        run: npm run release:package -- --prebuilt
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yt-looper-release-v${{ needs.verify.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Summarize dry run
        if: needs.verify.outputs.dry_run == 'true'
        run: |
          echo "## Release dry run v${{ needs.verify.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "All checks passed. The downloadable workflow artifact contains the three browser ZIPs, AMO source ZIP, SBOM, release manifest and checksums." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub Release
    needs: [verify, package]
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yt-looper-release-v${{ needs.verify.outputs.version }}
          path: artifacts/release
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/*
      - name: Create or repair GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Publish summary
        run: |
          echo "## Published ${{ needs.verify.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The GitHub Release contains independently named Firefox, Chrome and Safari packages, AMO sources, integrity metadata and provenance." >> "$GITHUB_STEP_SUMMARY"
