version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    groups:
      quality-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions:
          - ">=6.1.0"
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Madrid
    labels:
      - dependencies
      - github-actions
